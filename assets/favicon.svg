<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Smith chart">
  <!-- The Smith chart's defining construction and nothing else: the unit
       circle, and the r = 1 circle tangent to it at the open-circuit point.
       Gold is the interface colour, teal the impedance grid. -->
  <rect width="32" height="32" rx="6.5" fill="#17181b"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#e0b45c" stroke-width="2"/>
  <circle cx="21.25" cy="16" r="5.25" fill="none" stroke="#34c3a4" stroke-width="2"/>
  <line x1="5.5" y1="16" x2="26.5" y2="16" stroke="#e0b45c" stroke-width="1.2" opacity=".55"/>
</svg>
